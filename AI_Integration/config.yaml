embedding_model: text-embedding-3-small
chunk_size: 400
chunk_overlap: 50
top_k: 2

retrieval:
  vector_store_path: data/processed
  top_k: 2
  score_type: hybrid_rrf
  vector_weight: 0.6
  bm25_weight: 0.4

revision:
  max_loops: 2
  search_on_missing: true

semantic_memory:
  enabled: false
  recall_top_k: 5
  similarity_threshold: 0.75
  max_facts_to_extract: 10
  extraction_model: "gpt-4o-mini"

preference_memory:
  enabled: false
  detection_model: "gpt-4o-mini"
  allowed_frameworks:
    - "SWOT"
    - "Porter's 5 Forces"
    - "PESTEL"
    - "DCF"
    - "CAPM"
  allowed_formats:
    - "brief"
    - "detailed"
  allowed_risk_levels:
    - "conservative"
    - "moderate"
    - "aggressive"
  max_sectors: 5

